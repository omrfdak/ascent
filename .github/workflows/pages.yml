name: Documentation

# The tutorial is generated locally and committed, so publishing it is a copy
# rather than a build: qdoc needs the Felgo SDK, which the runner does not have.
on:
  push:
    branches: [master]
    paths:
      - doc/html/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/html

      - id: deployment
        uses: actions/deploy-pages@v4
